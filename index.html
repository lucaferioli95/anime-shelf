<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anime Shelf</title>
<meta name="theme-color" content="#1b1630">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
[hidden]{display:none!important}
:root{--bg:#f6f3fb;--surface:#fff;--fg:#1b1630;--muted:#6b6785;--line:#ded9ec;--accent:#ff6b6b;--accent-fg:#fff;--danger:#c23a3a;
 --anime:#e8f0ff;--anime-line:#9db8f0;--manga:#fff0e2;--manga-line:#f0b987;--S:#f2b84b;--A:#3fae7a;--B:#4a90d9;--C:#9a97ad;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#120f21;--surface:#1c1733;--fg:#ece9f6;--muted:#9a96b3;--line:#2f2850;--danger:#ef7a7a;--anime:#1c2745;--anime-line:#3b5393;--manga:#3a2619;--manga-line:#8a5a35;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 16px 6px;max-width:980px;margin:0 auto}
h1{margin:0;font-size:22px}
.ver{font:500 12px/1 ui-monospace,Menlo,monospace;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
.linkbtn:hover{color:var(--fg)}
.sp{margin-left:auto}
main{max-width:980px;margin:0 auto;padding:6px 16px 80px}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn:disabled{opacity:.45}
.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;position:relative}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 13px}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
.scores{display:inline-flex;gap:6px}
.sc{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:none;font-weight:800}
.sc.on[data-s=S],.chip.S{background:var(--S);border-color:var(--S);color:#2b1d00}
.sc.on[data-s=A],.chip.A{background:var(--A);border-color:var(--A);color:#fff}
.sc.on[data-s=B],.chip.B{background:var(--B);border-color:var(--B);color:#fff}
.sc.on[data-s=C],.chip.C{background:var(--C);border-color:var(--C);color:#fff}
.sugg{position:absolute;left:12px;right:12px;top:100%;margin-top:-4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0004;z-index:10;max-height:60vh;overflow:auto}
.sg{display:flex;gap:10px;align-items:center;padding:8px 10px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.sg:hover{background:#8882}
.sg img,.cov{width:40px;height:56px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.sg small{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:48px 1fr 58px minmax(100px,190px) 28px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.row.t-anime{background:var(--anime);border-color:var(--anime-line);border-left:5px solid var(--anime-line)}
.row.t-manga{background:var(--manga);border-color:var(--manga-line);border-left:5px solid var(--manga-line)}
.row .cov{width:48px;height:68px;border:0;padding:0;display:block}
.row .nm{border:0;background:none;font-weight:600;width:100%;padding:4px 2px;font-size:16px}
.row .meta{font-size:12px;color:var(--muted);padding:0 2px}
.row .wh{border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;width:100%}
.row .wh:focus,.row .nm:focus{outline:2px solid var(--accent);border-radius:6px}
.row .wh::placeholder{color:var(--muted)}
.chip{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:2px dashed var(--line);background:none;font-weight:800;font-size:20px;color:var(--muted)}
.chip.S,.chip.A,.chip.B,.chip.C{border-style:solid}
.rm{border:0;background:none;color:var(--muted);font-size:20px}
.rm:hover{color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
@media (max-width:560px){
 .row{grid-template-columns:48px 1fr 50px 24px;grid-template-areas:"c n s r" "c w s r"}
 .row .cov{grid-area:c}.row .info{grid-area:n}.row .wh{grid-area:w}.row .chip{grid-area:s}.row .rm{grid-area:r}
}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--surface);width:100%;max-width:640px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.covgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.covgrid button{border:2px solid transparent;border-radius:10px;background:none;padding:0;text-align:left;color:var(--fg)}
.covgrid button:hover{border-color:var(--accent)}
.covgrid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;display:block}
.covgrid small{display:block;font-size:11px;line-height:1.2;padding:4px 2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.foot{max-width:980px;margin:0 auto;color:var(--muted);font-size:12px;padding:0 16px 24px}
.foot a{color:inherit}
.tabs{display:flex;gap:4px;margin:12px 0 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:700;color:var(--muted)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab span{font-weight:500;opacity:.7;margin-left:4px}
.sc.sm{width:auto;padding:0 10px;font-weight:700;font-size:13px}
.seg2 button.on{background:var(--accent);color:#fff}
.scoreblock{display:flex;flex-direction:column;gap:4px;align-items:center}
.oth{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap}
.oth b{display:inline-flex;width:18px;height:18px;border-radius:5px;align-items:center;justify-content:center;color:#fff;font-size:11px}
.oth b.S{background:var(--S);color:#2b1d00}.oth b.A{background:var(--A)}.oth b.B{background:var(--B)}.oth b.C{background:var(--C)}
.watched{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.gate{max-width:420px;margin:60px auto;padding:24px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.gate p{color:var(--muted)}
.syncui{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>Anime Shelf <span class="ver" id="ver"></span></h1>
  <span class="syncui sp" id="syncUi"></span>
  <button type="button" class="linkbtn" id="installBtn">Install app</button>
</header>
<div class="gate" id="gate" hidden></div>
<main id="app" hidden>
  <div class="add" id="add">
    <div class="addrow">
      <div class="seg" id="typeSeg"><button type="button" data-t="anime" class="on">Anime</button><button type="button" data-t="manga">Manga</button></div>
      <div class="seg seg2" id="stSeg"><button type="button" data-st="rated" class="on">Seen it</button><button type="button" data-st="towatch">To watch / read</button></div>
    </div>
    <div class="addrow">
      <input class="inp" id="nameIn" placeholder="Name of the anime or manga…" autocomplete="off" style="flex:1;min-width:180px">
      <img id="pickCov" class="cov" alt="" hidden style="width:32px;height:44px">
    </div>
    <div class="addrow">
      <div class="scores" id="addScores"><button type="button" class="sc" data-s="S">S</button><button type="button" class="sc" data-s="A">A</button><button type="button" class="sc" data-s="B">B</button><button type="button" class="sc" data-s="C">C</button></div>
      <input class="inp" id="whereIn" list="whereList" placeholder="Where to watch / read" style="flex:1;min-width:160px">
      <button type="button" class="btn primary" id="addBtn">Add</button>
    </div>
    <datalist id="whereList"></datalist>
    <div class="sugg" id="sugg" hidden></div>
  </div>
  <div class="tabs" id="tabs"><button type="button" class="tab on" data-tab="rated">Shelf<span id="nRated"></span></button><button type="button" class="tab" data-tab="towatch">To watch / read<span id="nTo"></span></button></div>
  <div class="filters">
    <button type="button" class="pill on" data-ty="all">All</button><button type="button" class="pill" data-ty="anime">Anime</button><button type="button" class="pill" data-ty="manga">Manga</button>
    <span style="width:8px"></span>
    <button type="button" class="pill on" data-sc="all">Any score</button><button type="button" class="pill" data-sc="S">S</button><button type="button" class="pill" data-sc="A">A</button><button type="button" class="pill" data-sc="B">B</button><button type="button" class="pill" data-sc="C">C</button>
    <input type="search" class="inp" id="q" placeholder="Search…" style="max-width:150px;margin-left:auto">
    <select class="inp" id="by"><option value="all">Added by: anyone</option></select>
    <select class="inp" id="sort"><option value="score">Sort: my score</option><option value="name">Sort: name</option><option value="new">Sort: newest</option></select>
  </div>
  <div class="list" id="list"></div>
</main>
<div class="modal" id="modal" hidden><div class="box"><div style="display:flex;align-items:center;gap:8px"><b id="mTitle" style="flex:1">Choose a cover</b><button type="button" class="btn" id="mClose">Close</button></div><div class="covgrid" id="mGrid"></div></div></div>
<div class="toast" id="toast" hidden></div>
<p class="foot">Version <span id="ver2"></span> · <a href="https://github.com/lucaferioli95/anime-shelf/blob/main/CHANGELOG.md">Changelog</a> · <span id="hostNote"></span> · Covers from AniList and MyAnimeList</p>
<script src="install.js"></script>
<script src="supabase.js"></script>
<script>
var APP_VERSION = '2.1.0';
var $ = function(id){ return document.getElementById(id); };
$('ver').textContent = 'v' + APP_VERSION; $('ver2').textContent = APP_VERSION;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(t, ms){ var e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function(){ e.hidden = true; }, ms || 3000); }
var PLACES = ['Crunchyroll','Netflix','Disney+','Prime Video','Hulu','HIDIVE','Max','Apple TV+','YouTube','MANGA Plus','Webtoon','VIZ','Kindle','Physical copy','Not available'];
$('whereList').innerHTML = PLACES.map(function(p){ return '<option value="' + esc(p) + '">'; }).join('');

/* ---------- state ---------- */
var CACHE_KEY = 'anime-shelf-cache-v2', OLD_KEY = 'anime-shelf-v1', MIGRATED = 'anime-shelf-migrated';
var S = {me: '', people: {}, items: []};
var ui = {type: 'anime', status: 'rated', score: '', tab: 'rated', filterType: 'all', filterScore: 'all', by: 'all', q: '', sort: 'score', pick: null};
try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.items){ S.items = c.items; S.people = c.people || {}; S.me = c.me || ''; } } catch(e){}
function cacheSave(){ try { localStorage.setItem(CACHE_KEY, JSON.stringify({items: S.items, people: S.people, me: S.me})); } catch(e){} }
function nameOf(email){ return S.people[email] || (email || '?').split('@')[0]; }
function newId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- cover search: AniList, then Jikan ---------- */
var ALQ = 'query($s:String,$t:MediaType){Page(perPage:8){media(search:$s,type:$t,sort:SEARCH_MATCH){id title{romaji english} coverImage{large medium} seasonYear startDate{year} format}}}';
async function searchAniList(q, type){
  var res = await fetch('https://graphql.anilist.co', {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify({query: ALQ, variables: {s: q, t: type === 'manga' ? 'MANGA' : 'ANIME'}})});
  if (!res.ok) throw new Error('anilist ' + res.status);
  var j = await res.json(); if (j.errors) throw new Error('anilist query');
  return j.data.Page.media.map(function(m){ return {title: m.title.english || m.title.romaji, alt: m.title.romaji, cover: (m.coverImage.large || m.coverImage.medium), year: m.seasonYear || (m.startDate && m.startDate.year) || '', format: (m.format || '').replace(/_/g,' ')}; }).filter(function(m){ return m.cover; });
}
async function searchJikan(q, type){
  var res = await fetch('https://api.jikan.moe/v4/' + (type === 'manga' ? 'manga' : 'anime') + '?limit=8&q=' + encodeURIComponent(q));
  if (!res.ok) throw new Error('jikan ' + res.status);
  var j = await res.json();
  return (j.data || []).map(function(m){ var im = m.images && m.images.jpg; return {title: m.title_english || m.title, alt: m.title, cover: im && (im.large_image_url || im.image_url), year: m.year || (m.published && m.published.prop && m.published.prop.from && m.published.prop.from.year) || '', format: m.type || ''}; }).filter(function(m){ return m.cover; });
}
var cache = {};
async function searchCovers(q, type){
  q = q.trim(); if (q.length < 2) return [];
  var k = type + '|' + q.toLowerCase(); if (cache[k]) return cache[k];
  var out;
  try { out = await searchAniList(q, type); } catch(e){ out = await searchJikan(q, type); }
  if (!out.length){ try { out = await searchJikan(q, type); } catch(e){} }
  return (cache[k] = out || []);
}

/* ---------- add form ---------- */
function segClick(id, attr, key, after){ $(id).addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; ui[key] = b.dataset[attr]; Array.prototype.forEach.call($(id).children, function(x){ x.classList.toggle('on', x === b); }); if (after) after(); }); }
segClick('typeSeg', 't', 'type', function(){ ui.pick = null; $('pickCov').hidden = true; suggest(); });
segClick('stSeg', 'st', 'status', function(){ $('addScores').style.display = ui.status === 'towatch' ? 'none' : ''; });
$('addScores').addEventListener('click', function(e){ var b = e.target.closest('.sc'); if (!b) return; ui.score = ui.score === b.dataset.s ? '' : b.dataset.s; paintScores(); });
function paintScores(){ Array.prototype.forEach.call($('addScores').children, function(x){ x.classList.toggle('on', x.dataset.s === ui.score); }); }
var sgTimer = null, sgSeq = 0;
$('nameIn').addEventListener('input', function(){ ui.pick = null; $('pickCov').hidden = true; clearTimeout(sgTimer); sgTimer = setTimeout(suggest, 350); });
$('nameIn').addEventListener('focus', function(){ if ($('nameIn').value.trim().length > 1) suggest(); });
document.addEventListener('click', function(e){ if (!e.target.closest('#add')) $('sugg').hidden = true; });
async function suggest(){
  var q = $('nameIn').value.trim(), my = ++sgSeq; var box = $('sugg');
  if (q.length < 2){ box.hidden = true; return; }
  box.hidden = false; box.innerHTML = '<div class="empty" style="padding:14px">Searching…</div>';
  try {
    var res = await searchCovers(q, ui.type); if (my !== sgSeq) return;
    box.innerHTML = res.length ? res.map(function(m, i){ return '<button type="button" class="sg" data-i="' + i + '"><img src="' + esc(m.cover) + '" alt=""><span><b>' + esc(m.title) + '</b><br><small>' + esc([m.format, m.year].filter(Boolean).join(' · ')) + (m.alt && m.alt !== m.title ? ' · ' + esc(m.alt) : '') + '</small></span></button>'; }).join('') : '<div class="empty" style="padding:14px">No match found. You can still add it without a cover.</div>';
    box._res = res;
  } catch(e){ if (my === sgSeq) box.innerHTML = '<div class="empty" style="padding:14px">Could not reach the cover search. You can still add it.</div>'; }
}
$('sugg').addEventListener('click', function(e){
  var b = e.target.closest('.sg'); if (!b) return; var m = $('sugg')._res[+b.dataset.i];
  ui.pick = m; $('nameIn').value = m.title; $('pickCov').src = m.cover; $('pickCov').hidden = false; $('sugg').hidden = true;
});
$('addBtn').onclick = addItem;
$('nameIn').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); addItem(); } });
async function addItem(){
  var name = $('nameIn').value.trim(); if (!name){ $('nameIn').focus(); return; }
  var it = {id: newId(), name: name, type: ui.type, cover: ui.pick ? ui.pick.cover : '', year: ui.pick ? String(ui.pick.year || '') : '', where: $('whereIn').value.trim(), status: ui.status, added_by: S.me, created: new Date().toISOString(), scores: {}};
  if (ui.status === 'rated' && ui.score) it.scores[S.me] = ui.score;
  S.items.unshift(it); cacheSave();
  $('nameIn').value = ''; $('whereIn').value = ''; ui.pick = null; ui.score = ''; paintScores(); $('pickCov').hidden = true; $('sugg').hidden = true;
  if (it.status !== ui.tab){ setTab(it.status); } else render();
  var r = await sb.from('shelf_items').insert({id: it.id, name: it.name, type: it.type, cover: it.cover, year: it.year, where_to: it.where, status: it.status});
  if (r.error){ toast('Could not save: ' + r.error.message, 5000); S.items = S.items.filter(function(x){ return x !== it; }); cacheSave(); render(); return; }
  if (it.scores[S.me]) await sb.from('shelf_scores').upsert({item_id: it.id, user_email: S.me, score: it.scores[S.me]});
  if (!it.cover) autoCover(it);
}
async function autoCover(it){
  try { var res = await searchCovers(it.name, it.type); if (res.length){ it.cover = res[0].cover; it.year = it.year || String(res[0].year || ''); cacheSave(); render(); await sb.from('shelf_items').update({cover: it.cover, year: it.year, updated_at: new Date().toISOString()}).eq('id', it.id); } } catch(e){}
}

/* ---------- list ---------- */
var ORDER = {S:0, A:1, B:2, C:3, '':4};
function myScore(it){ return it.scores[S.me] || ''; }
function shown(){
  var q = ui.q.toLowerCase();
  var l = S.items.filter(function(r){ return r.status === ui.tab && (ui.filterType === 'all' || r.type === ui.filterType) && (ui.filterScore === 'all' || myScore(r) === ui.filterScore) && (ui.by === 'all' || r.added_by === ui.by) && (!q || r.name.toLowerCase().includes(q) || (r.where || '').toLowerCase().includes(q)); });
  l.sort(function(a, b){
    if (ui.sort === 'name') return a.name.localeCompare(b.name);
    if (ui.sort === 'new') return (b.created || '').localeCompare(a.created || '');
    return (ORDER[myScore(a)] - ORDER[myScore(b)]) || a.name.localeCompare(b.name);
  });
  return l;
}
function render(){
  var l = shown();
  $('nRated').textContent = S.items.filter(function(r){ return r.status === 'rated'; }).length;
  $('nTo').textContent = S.items.filter(function(r){ return r.status === 'towatch'; }).length;
  var by = $('by'), cur = ui.by;
  by.innerHTML = '<option value="all">Added by: anyone</option>' + Object.keys(S.people).map(function(e){ return '<option value="' + esc(e) + '">' + esc(S.people[e]) + '</option>'; }).join(''); by.value = cur;
  $('list').innerHTML = l.length ? l.map(function(r){
    var mine = myScore(r);
    var others = Object.keys(r.scores).filter(function(e){ return e !== S.me; }).map(function(e){ return '<span class="oth" title="' + esc(nameOf(e)) + '\'s score">' + esc(nameOf(e)) + ' <b class="' + esc(r.scores[e]) + '">' + esc(r.scores[e]) + '</b></span>'; }).join('');
    var right = r.status === 'towatch' ? '<button type="button" class="watched" data-a="watched">Done ✓</button>' : '<div class="scoreblock"><button type="button" class="chip ' + esc(mine) + '" data-a="score" title="Tap to set your score">' + (mine || '?') + '</button>' + others + '</div>';
    return '<div class="row t-' + esc(r.type) + '" data-id="' + esc(r.id) + '"><button type="button" class="cov" data-a="cover" title="Change cover">' + (r.cover ? '<img class="cov" src="' + esc(r.cover) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '<span class="cov" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center">no cover</span>') + '</button>' +
      '<div class="info"><input class="nm" data-f="name" value="' + esc(r.name) + '"><div class="meta">' + (r.type === 'manga' ? 'Manga' : 'Anime') + (r.year ? ' · ' + esc(r.year) : '') + ' · added by ' + esc(nameOf(r.added_by)) + '</div></div>' + right +
      '<input class="wh" data-f="where" list="whereList" placeholder="Where to watch" value="' + esc(r.where || '') + '">' +
      (r.added_by === S.me ? '<button type="button" class="rm" data-a="del" title="Delete">×</button>' : '<span></span>') + '</div>';
  }).join('') : '<div class="empty">' + (S.items.length ? 'Nothing here with these filters.' : 'Nothing yet. Type a name above to add the first one.') + '</div>';
}
function itemOf(el){ var d = el.closest('.row'); return d && S.items.find(function(r){ return r.id === d.dataset.id; }); }
$('list').addEventListener('click', async function(e){
  var b = e.target.closest('[data-a]'); if (!b) return; var r = itemOf(b); if (!r) return;
  if (b.dataset.a === 'score'){
    var seq = ['S','A','B','C',''], nx = seq[(seq.indexOf(myScore(r)) + 1) % seq.length];
    if (nx) r.scores[S.me] = nx; else delete r.scores[S.me]; cacheSave(); render();
    var q = nx ? await sb.from('shelf_scores').upsert({item_id: r.id, user_email: S.me, score: nx, updated_at: new Date().toISOString()}) : await sb.from('shelf_scores').delete().eq('item_id', r.id).eq('user_email', S.me);
    if (q.error){ toast('Could not save the score: ' + q.error.message, 5000); refresh(); }
  } else if (b.dataset.a === 'watched'){
    r.status = 'rated'; cacheSave(); setTab('rated'); toast('Moved to the shelf. Tap the ? to give your score.');
    var q2 = await sb.from('shelf_items').update({status: 'rated', updated_at: new Date().toISOString()}).eq('id', r.id); if (q2.error){ toast('Could not save: ' + q2.error.message, 5000); refresh(); }
  } else if (b.dataset.a === 'del'){
    if (!confirm('Delete "' + r.name + '" for everyone?')) return;
    S.items = S.items.filter(function(x){ return x !== r; }); cacheSave(); render();
    var q3 = await sb.from('shelf_items').delete().eq('id', r.id); if (q3.error){ toast('Could not delete: ' + q3.error.message, 5000); refresh(); }
  } else if (b.dataset.a === 'cover') openCovers(r);
});
$('list').addEventListener('change', async function(e){
  var f = e.target.dataset.f, r = itemOf(e.target); if (!f || !r) return; var v = e.target.value.trim();
  if (f === 'name' && !v){ e.target.value = r.name; return; }
  r[f] = v; cacheSave();
  var patch = {updated_at: new Date().toISOString()}; patch[f === 'where' ? 'where_to' : f] = v;
  var q = await sb.from('shelf_items').update(patch).eq('id', r.id); if (q.error){ toast('Could not save: ' + q.error.message, 5000); refresh(); }
  if (f === 'name' && !r.cover) autoCover(r);
});
function setTab(t){ ui.tab = t; Array.prototype.forEach.call($('tabs').children, function(x){ x.classList.toggle('on', x.dataset.tab === t); }); render(); }
$('tabs').addEventListener('click', function(e){ var b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); });
document.querySelector('.filters').addEventListener('click', function(e){
  var p = e.target.closest('.pill'); if (!p) return;
  if (p.dataset.ty){ ui.filterType = p.dataset.ty; } if (p.dataset.sc){ ui.filterScore = p.dataset.sc; }
  Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(x){ x.classList.toggle('on', (x.dataset.ty && x.dataset.ty === ui.filterType) || (x.dataset.sc && x.dataset.sc === ui.filterScore)); });
  render();
});
$('q').oninput = function(){ ui.q = this.value; render(); };
$('sort').onchange = function(){ ui.sort = this.value; render(); };
$('by').onchange = function(){ ui.by = this.value; render(); };

/* ---------- cover chooser ---------- */
async function openCovers(r){
  $('modal').hidden = false; $('mTitle').textContent = 'Choose a cover for ' + r.name; $('mGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">Searching…</div>';
  try {
    var res = await searchCovers(r.name, r.type);
    $('mGrid').innerHTML = res.length ? res.map(function(m, i){ return '<button type="button" data-i="' + i + '"><img src="' + esc(m.cover) + '" alt=""><small>' + esc(m.title) + (m.year ? ' (' + esc(m.year) + ')' : '') + '</small></button>'; }).join('') : '<div class="empty" style="grid-column:1/-1">No covers found for this name. Edit the name and try again.</div>';
    $('mGrid')._res = res; $('mGrid')._row = r;
  } catch(e){ $('mGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">Could not reach the cover search right now.</div>'; }
}
$('mGrid').addEventListener('click', async function(e){ var b = e.target.closest('button'); if (!b) return; var m = $('mGrid')._res[+b.dataset.i], r = $('mGrid')._row; r.cover = m.cover; r.year = String(m.year || r.year || ''); cacheSave(); $('modal').hidden = true; render(); await sb.from('shelf_items').update({cover: r.cover, year: r.year, updated_at: new Date().toISOString()}).eq('id', r.id); });
$('mClose').onclick = function(){ $('modal').hidden = true; };
$('modal').addEventListener('click', function(e){ if (e.target === $('modal')) $('modal').hidden = true; });

async function refresh(){

async function migrateOld(){
  try {
    if (localStorage.getItem(MIGRATED)) return;
    var old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); if (!old || !old.rows || !old.rows.length){ localStorage.setItem(MIGRATED, '1'); return; }

      if (r.score) await sb.from('shelf_scores').upsert({item_id: id, user_email: S.me, score: r.score});
    }
